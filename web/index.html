<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuratedSkills — Software Engineering & Security Agent Skills</title>
    <meta
      name="description"
      content="A curated registry of high-trust agent skills for software engineering and security."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./weblab.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-top">
          <div class="brand">
            <h1>CuratedSkills</h1>
            <p class="tagline">High-trust agent skills for software engineering and security, curated for impact</p>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
            <span class="theme-icon" aria-hidden="true">☀</span>
          </button>
        </div>

        <div class="search-row">
          <label class="search-field" for="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Search skills, tags, descriptions…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>

        <div class="filters" id="filters">
          <div class="filter-group" id="tier-filters"></div>
          <div class="filter-group" id="category-filters"></div>
        </div>

        <p class="results-meta" id="results-meta"></p>
      </header>

      <main>
        <div id="skill-grid" class="skill-grid" role="list"></div>
        <p id="empty-state" class="empty-state" hidden>No skills match your filters.</p>
      </main>

      <footer class="footer">
        <p>
          Primary link opens the skill folder on GitHub.
          <a href="https://github.com/jahnog/CuratedSkills" id="repo-link" target="_blank" rel="noopener noreferrer"
            >View source</a
          >
        </p>
      </footer>
    </div>

    <script src="./analytics.js"></script>
    <script src="./vendor/minisearch.min.js"></script>
    <script src="./data/index.js"></script>
    <script src="./app.js"></script>
    <noscript
      ><p>
        <img
          referrerpolicy="no-referrer-when-downgrade"
          src="https://contentlabstudy.com/Mat0mo/matomo.php?idsite=17&amp;rec=1"
          style="border: 0"
          alt=""
        />
      </p></noscript
    >
  </body>
</html>
